name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://mch_english:changeme@localhost:5432/mch_english
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mch_english
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: mch_english
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mch_english -d mch_english"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # The TTS service shells out to eSpeak-NG, which the backend image installs but
      # the runner does not ship: without it the dictation tests fail here while
      # passing in every container.
      - name: Install eSpeak-NG
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng

      # No --no-cache-dir here: that flag belongs in the image build (keeps layers
      # small), but setup-python's `cache: pip` then finds an empty cache directory
      # and fails the job in its post step. Here the cache is the point.
      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify Alembic migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        # pytest's own conftest.py creates and manages a separate "mch_english_test"
        # database on this same Postgres service -- the migrated "mch_english"
        # database above is only exercised by the migration step, keeping the two
        # concerns (does the schema migrate cleanly / do the tests pass) independent.
        run: pytest -q

  docker-build:
    name: Verify Docker builds
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mch-english-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t mch-english-frontend:ci ./frontend
